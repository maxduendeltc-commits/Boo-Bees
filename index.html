<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scavenger Hunt Tracker</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 500px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #333;
    }
    .progress-bar {
      font-weight: bold;
      margin-bottom: 1.5rem;
      padding: 0.75rem;
      background: #eef2ff;
      border-radius: 8px;
      color: #3730a3;
      text-align: center;
    }
    .item-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      margin-bottom: 0.75rem;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    /* Style for completed items */
    .item-card.found {
      background-color: #f3f4f6;
      border-color: #d1d5db;
    }
    .item-card.found .item-title {
      text-decoration: line-through;
      color: #9ca3af;
    }
    button.found-btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button.found-btn.is-found {
      background-color: #059669;
    }
    .reset-btn {
      margin-top: 2rem;
      width: 100%;
      background: none;
      border: 1px dashed #ef4444;
      color: #ef4444;
      padding: 0.5rem;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Scavenger Hunt Checklist</h2>
  <div class="progress-bar" id="progress">Found 0 of 0 items</div>

  <div id="hunt-list"></div>

  <button class="reset-btn" id="reset-btn">Reset All Progress</button>

  <script>
    // 1. Array of scavenger hunt target items (each needs a unique 'id')
    const huntItems = [
      { id: 'item_1', name: 'Palapa by the beach' },
      { id: 'item_2', name: 'Vintage souvenir shop sign' },
      { id: 'item_3', name: 'Local street art / mural' },
      { id: 'item_4', name: 'Fresh coconut stand' }
    ];

    // Key used to store array of found IDs in localStorage
    const STORAGE_KEY = 'scavenger_found_items';

    // 2. Load saved IDs from localStorage (or default to empty array)
    function getSavedFoundIds() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : [];
    }

    // 3. Save updated IDs array to localStorage
    function saveFoundIds(foundArray) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(foundArray));
    }

    // 4. Toggle item status when "Found It!" button is clicked
    function toggleFoundStatus(itemId) {
      let foundIds = getSavedFoundIds();

      if (foundIds.includes(itemId)) {
        // Remove item if already found (uncheck)
        foundIds = foundIds.filter(id => id !== itemId);
      } else {
        // Add item if newly found
        foundIds.push(itemId);
      }

      saveFoundIds(foundIds);
      renderList();
    }

    // 5. Render list & update progress display
    function renderList() {
      const listContainer = document.getElementById('hunt-list');
      const progressContainer = document.getElementById('progress');
      const foundIds = getSavedFoundIds();

      listContainer.innerHTML = '';

      huntItems.forEach(item => {
        const isFound = foundIds.includes(item.id);

        const card = document.createElement('div');
        card.className = `item-card ${isFound ? 'found' : ''}`;

        card.innerHTML = `
          <span class="item-title">${item.name}</span>
          <button class="found-btn ${isFound ? 'is-found' : ''}" onclick="toggleFoundStatus('${item.id}')">
            ${isFound ? '✓ Found' : 'Found It!'}
          </button>
        `;

        listContainer.appendChild(card);
      });

      // Update progress header
      progressContainer.textContent = `Found ${foundIds.length} of ${huntItems.length} items`;
    }

    // Optional: Reset button to start over
    document.getElementById('reset-btn').addEventListener('click', () => {
      if (confirm('Are you sure you want to reset all found items?')) {
        localStorage.removeItem(STORAGE_KEY);
        renderList();
      }
    });

    // Initial render on load
    document.addEventListener('DOMContentLoaded', renderList);
  </script>

</body>
</html>
